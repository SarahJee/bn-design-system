$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Sort toggle
status: experimental
description: 'Two-option segmented control for sorting results. Figma: DT_Toggle (Sort) and M_Toggle.'
props:
  type: object
  required:
    - name
  properties:
    label:
      type: string
      title: Label
      description: 'Defaults to "Sort by:".'
    name:
      type: string
      title: Field name
    options:
      type: array
      title: Options
      items:
        type: object
        properties:
          value:
            type: string
          label:
            type: string
    value:
      type: string
      title: Selected value
    size:
      type: string
      title: Size
      description: 'default = DT_Toggle (Sort), hugs its labels. mobile = M_Toggle, 320px with equal halves.'
      enum: [default, mobile]
