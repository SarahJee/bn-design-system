$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Search
status: experimental
description: 'Site search box with a submit button. Figma: DT_Search.'
props:
  type: object
  properties:
    action:
      type: string
      title: Form action
    name:
      type: string
      title: Query parameter name
    value:
      type: string
      title: Search term
    placeholder:
      type: string
      title: Placeholder
    label:
      type: string
      title: Accessible label
    button_label:
      type: string
      title: Button label
      description: 'Read by screen readers.'
    id:
      type: string
      title: Input ID
