$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Tag
status: experimental
description: 'Small uppercase label on cards and articles. Figma: DT_Tag and M_Tag (identical).'
props:
  type: object
  required:
    - label
  properties:
    label:
      type: string
      title: Label
    type:
      type: string
      title: Type
      enum: [category, sector-briefing, sponsored]
